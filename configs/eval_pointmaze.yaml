#@package _global_
defaults:
  - alg: dime_pointmaze
  - sampler: dis
  - setup
  - maze: default
  - _self_

seed: 0
use_jit: true
tot_time_steps: 1e6
log_freq: 100
step_size: ${alg.optimizer.lr_actor}
step_size_betas: ${alg.optimizer.lr_actor}
use_path_gradient: False
use_target_score: False
dt: 0.1
learn_dt: True
per_step_dt: False
per_dim_friction: True
use_step_size_scheduler: False
warmup: const
iters: ${tot_time_steps}
warmup_iters: 60_000

env_name: pointmaze/large-sparse-v0

eval:
  # Path to model checkpoint directory written by DIME._save_model.
  # Set model_path=null to evaluate a randomly-initialised model.
  model_path: null
  model_steps: null

  n_episodes: 10         # rollout evaluation episodes
  pos_grid_res: 20       # grid points per axis for position landscape
  pos_range: 5.0         # ±range for x/y grid (large maze spans ~±5)
  n_vel_grid: 5          # grid points per axis for velocity (pos-vel landscape)
  vel_range: 2.0         # ±range for vx/vy grid
  n_act_grid: 25         # grid points per axis for action-space sweep
  n_action_samples: 8    # diffusion samples per query point when estimating V(s)
